# Configuración del análisis de SonarQube (la lee el scanner: npm run sonar)
# La URL del servidor y el token NO van aquí: se leen de ../.env.sonar

# Identificador único del proyecto en SonarQube
sonar.projectKey=orm-lab-prisma
sonar.projectName=ORM Lab · Prisma
sonar.projectVersion=1.0.0

# Qué se analiza
sonar.sources=src
sonar.tests=test
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.exclusions=src/generated/**,dist/**

# Cobertura: reporte LCOV generado por c8 (npm run test:coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Scripts de demostración: se analizan, pero no cuentan para la cobertura
sonar.coverage.exclusions=src/server.ts,src/index.ts,src/seed.ts,src/consultas.ts,src/transacciones.ts,src/errores.ts

# Descomenta para que el scanner espere el Quality Gate y falle si no pasa (útil en CI)
# sonar.qualitygate.wait=true
